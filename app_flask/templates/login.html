<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Asistente Nutrimental</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
            overflow: hidden;
        }

        .tabs {
            display: flex;
            border-bottom: 2px solid #f0f0f0;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 18px;
            cursor: pointer;
            font-size: 18px;
            font-weight: 600;
            color: #888;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        .tab.activo {
            color: #667eea;
            background: white;
            border-bottom: 3px solid #667eea;
        }

        .formulario {
            padding: 30px;
            display: none;
        }

        .formulario.activo {
            display: block;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
            font-size: 24px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
            box-sizing: border-box;
        }

        input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .info-text {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #888;
        }

        .info-text a {
            color: #667eea;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="tabs">
            <div class="tab activo" id="tabLogin">Iniciar Sesión</div>
            <div class="tab" id="tabRegistro">Crear Cuenta</div>
        </div>

        <!-- Formulario de Login -->
        <form class="formulario activo" id="formLogin" method="POST" action="/">
            <h2>Bienvenido</h2>
            <input type="text" id="usuarioOCorreo" name="email" placeholder="Correo electrónico" autocomplete="off">
            <input type="password" id="passwordLogin" name="password" placeholder="Contraseña">
            <button type="submit" id="btnLogin">Entrar</button>
        </form>

        <!-- Formulario de Registro -->
        <form class="formulario" id="formRegistro" method="POST" action="/register">
            <h2>Regístrate</h2>
            <input type="email" id="emailRegistro" name="email" placeholder="Correo electrónico" autocomplete="off">
            <input type="password" id="passwordRegistro" name="password" placeholder="Contraseña">
            <input type="password" id="confirmarPassword" placeholder="Confirmar contraseña">
            <button type="submit" id="btnRegistro">Crear cuenta</button>
        </form>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const tabLogin = document.getElementById("tabLogin");
            const tabRegistro = document.getElementById("tabRegistro");
            const formLogin = document.getElementById("formLogin");
            const formRegistro = document.getElementById("formRegistro");

            // Cambiar entre tabs
            tabLogin.addEventListener("click", function() {
                formLogin.classList.add("activo");
                formRegistro.classList.remove("activo");
                tabLogin.classList.add("activo");
                tabRegistro.classList.remove("activo");
            });

            tabRegistro.addEventListener("click", function() {
                formRegistro.classList.add("activo");
                formLogin.classList.remove("activo");
                tabRegistro.classList.add("activo");
                tabLogin.classList.remove("activo");
            });

            // ==========================
            // FUNCIONES DE VALIDACIÓN
            // ==========================

            function validarCorreo(email) {
                const errores = [];
                if (!email) {
                    errores.push("El correo no puede estar vacío.");
                    return errores;
                }
                if (email.length > 150) {
                    errores.push("El correo no debe superar 150 caracteres.");
                }
                const patron = /^[\w.-]+@[\w.-]+\.\w+$/;
                if (!patron.test(email)) {
                    errores.push("El correo no tiene un formato válido.");
                }
                return errores;
            }

            function validarPasswordRegistro(password) {
                const errores = [];
                if (!password) {
                    errores.push("La contraseña no puede estar vacía.");
                    return errores;
                }
                if (password.length < 8) {
                    errores.push("La contraseña debe tener mínimo 8 caracteres.");
                }
                if (new TextEncoder().encode(password).length > 72) {
                    errores.push("La contraseña no debe superar 72 bytes.");
                }
                if (!/[A-Z]/.test(password)) {
                    errores.push("La contraseña debe tener al menos una mayúscula.");
                }
                if (!/[a-z]/.test(password)) {
                    errores.push("La contraseña debe tener al menos una minúscula.");
                }
                if (!/[0-9]/.test(password)) {
                    errores.push("La contraseña debe tener al menos un número.");
                }
                return errores;
            }

            function validarPasswordLogin(password) {
                const errores = [];
                if (!password) {
                    errores.push("La contraseña no puede estar vacía.");
                }
                if (new TextEncoder().encode(password).length > 72) {
                    errores.push("La contraseña no debe superar 72 bytes.");
                }
                return errores;
            }

            function alertaError(errores) {
                Swal.fire({
                    icon: "error",
                    title: "Datos inválidos",
                    html: errores.join("<br>"),
                    confirmButtonText: "Corregir"
                });
            }

            function alertaExito(titulo, mensaje) {
                Swal.fire({
                    icon: "success",
                    title: titulo,
                    html: mensaje,
                    confirmButtonText: "Aceptar"
                });
            }

            // ==========================
            // VALIDAR LOGIN
            // ==========================

            document.getElementById("btnLogin").addEventListener("click", function(e) {
                e.preventDefault();
                
                const usuarioOCorreo = document.getElementById("usuarioOCorreo").value.trim().toLowerCase();
                const password = document.getElementById("passwordLogin").value;
                
                let errores = [];
                errores.push(...validarCorreo(usuarioOCorreo));
                errores.push(...validarPasswordLogin(password));
                
                if (errores.length > 0) {
                    alertaError(errores);
                    return;
                }
                
                // Enviar formulario
                document.getElementById("formLogin").submit();
            });

            // ==========================
            // VALIDAR REGISTRO
            // ==========================

            document.getElementById("btnRegistro").addEventListener("click", function(e) {
                e.preventDefault();
                
                const email = document.getElementById("emailRegistro").value.trim().toLowerCase();
                const password = document.getElementById("passwordRegistro").value;
                const confirmarPassword = document.getElementById("confirmarPassword").value;
                
                let errores = [];
                errores.push(...validarCorreo(email));
                errores.push(...validarPasswordRegistro(password));
                
                if (password !== confirmarPassword) {
                    errores.push("Las contraseñas no coinciden.");
                }
                
                if (errores.length > 0) {
                    alertaError(errores);
                    return;
                }
                
                // Enviar formulario
                document.getElementById("formRegistro").submit();
            });
        });
    </script>
</body>

</html>
