<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            background-color: #0f172a;
            color: white;
        }

        .profile-card {
            background-color: #1e293b;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
        }

        .form-control,
        .form-select {
            background-color: #334155;
            border: none;
            color: white;
        }

        .form-control:focus,
        .form-select:focus {
            background-color: #334155;
            color: white;
            box-shadow: none;
            border: 1px solid #3b82f6;
        }

        .section-title {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .btn-save {
            background-color: #2563eb;
            border: none;
            padding: 12px;
            border-radius: 12px;
            width: 100%;
            font-weight: bold;
        }

        .btn-save:hover {
            background-color: #1d4ed8;
        }

        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background-color: #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: auto;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="profile-card">
                    <div class="text-center">
                        <div class="avatar">👤</div>
                        <h2>Perfil del Paciente</h2>
                        <p class="text-secondary">Actualiza tu información clínica y nutrimental</p>
                    </div>
                    <hr>

                    <form id="profileForm">
                        <div class="section-title">Información Personal</div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Nombre completo</label>
                                <input type="text" id="nombre" name="nombre" class="form-control" 
                                       value="{{ profile.nombre if profile else '' }}" required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Edad</label>
                                <input type="number" id="edad" name="edad" class="form-control" 
                                       value="{{ profile.edad if profile else '' }}" required>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Peso (kg)</label>
                                <input type="number" step="0.1" id="peso" name="peso" class="form-control" 
                                       value="{{ profile.peso_kg if profile else '' }}" required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Altura (cm)</label>
                                <input type="number" id="altura" name="altura" class="form-control" 
                                       value="{{ profile.altura_cm if profile else '' }}" required>
                            </div>
                        </div>

                        <div class="section-title mt-4">Información Médica</div>

                        <div class="mb-3">
                            <label class="form-label">Notas / Restricciones alimenticias</label>
                            <textarea id="notas" name="notas" class="form-control" rows="4" 
                                      placeholder="Ej. evitar azúcar, hipertensión, dieta baja en sodio...">{{ profile.notas if profile else '' }}</textarea>
                        </div>

                        <div class="mt-4">
                            <button type="button" id="btnGuardar" class="btn btn-save">Guardar Perfil</button>
                        </div>
                    </form>

                    <div class="text-center mt-4">
                        <a href="/dashboard" class="btn btn-outline-light">Volver al Dashboard</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById("btnGuardar").addEventListener("click", async function(e) {
            e.preventDefault();
            
            // Obtener valores
            const nombre = document.getElementById("nombre").value.trim();
            const edad = document.getElementById("edad").value.trim();
            const peso_kg = document.getElementById("peso").value.trim();
            const altura_cm = document.getElementById("altura").value.trim();
            const notas = document.getElementById("notas").value.trim();
            
            // ======================================
            // VALIDACIONES
            // ======================================
            const errores = [];
            
            // Validar nombre
            if (!nombre) {
                errores.push("El nombre del paciente no puede estar vacío.");
            } else if (nombre.length > 100) {
                errores.push("El nombre del paciente no debe superar 100 caracteres.");
            } else if (!/^[a-zA-ZÁÉÍÓÚáéíóúÑñ\s]+$/.test(nombre)) {
                errores.push("El nombre solo debe contener letras y espacios.");
            }
            
            // Validar edad
            if (!edad) {
                errores.push("La edad no puede estar vacía.");
            } else {
                const edadNum = parseInt(edad);
                if (isNaN(edadNum)) {
                    errores.push("La edad debe ser un número entero.");
                } else if (edadNum <= 0) {
                    errores.push("La edad debe ser mayor que cero.");
                } else if (edadNum > 130) {
                    errores.push("La edad no debe ser mayor a 130.");
                }
            }
            
            // Validar peso
            if (!peso_kg) {
                errores.push("El peso no puede estar vacío.");
            } else {
                const pesoNum = parseFloat(peso_kg);
                if (isNaN(pesoNum)) {
                    errores.push("El peso debe ser un número válido.");
                } else if (pesoNum <= 0) {
                    errores.push("El peso debe ser mayor que cero.");
                } else if (pesoNum > 999.99) {
                    errores.push("El peso no debe superar 999.99 kg.");
                } else if (!/^\d{1,3}(\.\d{1,2})?$/.test(peso_kg)) {
                    errores.push("El peso debe tener máximo 3 dígitos enteros y 2 decimales.");
                }
            }
            
            // Validar altura
            if (!altura_cm) {
                errores.push("La altura no puede estar vacía.");
            } else {
                const alturaNum = parseInt(altura_cm);
                if (isNaN(alturaNum)) {
                    errores.push("La altura debe ser un número entero.");
                } else if (alturaNum <= 0) {
                    errores.push("La altura debe ser mayor que cero.");
                } else if (alturaNum > 300) {
                    errores.push("La altura no debe ser mayor a 300 cm.");
                }
            }
            
            // Validar notas
            if (notas && notas.length > 500) {
                errores.push("Las notas no deben superar 500 caracteres.");
            }
            
            // Mostrar errores si existen
            if (errores.length > 0) {
                Swal.fire({
                    icon: "error",
                    title: "Datos inválidos",
                    html: errores.join("<br>"),
                    confirmButtonText: "Corregir"
                });
                return;
            }
            
            // Mostrar loading
            Swal.fire({
                title: "Guardando...",
                text: "Por favor espera",
                allowOutsideClick: false,
                didOpen: () => {
                    Swal.showLoading();
                }
            });
            
            // Enviar al backend
            try {
                const response = await fetch("/api/profile", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        nombre: nombre,
                        edad: edad,
                        peso_kg: peso_kg,
                        altura_cm: altura_cm,
                        notas: notas
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    Swal.fire({
                        icon: "success",
                        title: "¡Éxito!",
                        text: data.message,
                        confirmButtonText: "Continuar"
                    }).then(() => {
                        window.location.href = "/dashboard";
                    });
                } else {
                    if (data.errors) {
                        Swal.fire({
                            icon: "error",
                            title: "Datos inválidos",
                            html: data.errors.join("<br>"),
                            confirmButtonText: "Corregir"
                        });
                    } else {
                        Swal.fire({
                            icon: "error",
                            title: "Error",
                            text: data.message,
                            confirmButtonText: "Intentar de nuevo"
                        });
                    }
                }
            } catch (error) {
                Swal.fire({
                    icon: "error",
                    title: "Error de conexión",
                    text: "No se pudo conectar con el servidor",
                    confirmButtonText: "Intentar de nuevo"
                });
            }
        });
    </script>
</body>

</html>
